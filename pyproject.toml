[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lverror"
version = "1.0.0"
description = "Offline lookup that turns a LabVIEW or NI error code into NI's own description, with no LabVIEW installed"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Javier Lianes", email = "javier@lianes8studio.com" }]
keywords = [
    "labview",
    "national-instruments",
    "error-codes",
    "visa",
    "daqmx",
    "explain-error",
    "test-automation",
    "offline",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
lverror = "lverror._cli:main"

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "build", "twine"]

[project.urls]
Homepage = "https://github.com/JaviLianes8/lverror"
Source = "https://github.com/JaviLianes8/lverror"
Documentation = "https://github.com/JaviLianes8/lverror/blob/main/GUIDE.md"
Issues = "https://github.com/JaviLianes8/lverror/issues"
Changelog = "https://github.com/JaviLianes8/lverror/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[tool.hatch.build.targets.wheel]
packages = ["src/lverror"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/lverror",
    "tests",
    "scripts/build_messages.py",
    "scripts/capture_sources.py",
    "README.md",
    "GUIDE.md",
    "CHANGELOG.md",
    "LICENSE",
    "NOTICE",
    "pyproject.toml",
]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
